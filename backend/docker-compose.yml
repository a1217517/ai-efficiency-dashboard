version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-efficiency-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ai_efficiency}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ai_efficiency}"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-api:
    build: .
    container_name: ai-efficiency-admin
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ai_efficiency}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-ai-efficiency-secret-key-2026}
      JWT_EXPIRE: ${JWT_EXPIRE:-24}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
